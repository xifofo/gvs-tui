name: GVS maintained RE
on:
  workflow_dispatch:
  push:
    paths: ['third_party/N_m3u8DL-RE/**', 'scripts/build-managed-re.ps1', '.github/workflows/managed-re.yml']
    tags: ['managed-re-v*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft RE release
        if: startsWith(github.ref, 'refs/tags/managed-re-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "GVS RE $GITHUB_REF_NAME" --notes-file docs/release-managed-re-v0.6.0-iq.3.md
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build our pinned RE
        shell: pwsh
        run: ./scripts/build-managed-re.ps1 -Runtime '${{ matrix.rid }}' -Output '.build/managed-re/${{ matrix.rid }}'
      - name: IQ native CRC and clear-segment regression
        run: dotnet test third_party/N_m3u8DL-RE/src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -c Release --filter 'FullyQualifiedName~IqBbtsTests|FullyQualifiedName~IqMdcmDescriptorTests'
      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path '.build/managed-re/${{ matrix.rid }}/N_m3u8DL-RE*', '.build/managed-re/${{ matrix.rid }}/LICENSE.txt', '.build/managed-re/${{ matrix.rid }}/gvs-source.json', '.build/managed-re/${{ matrix.rid }}/README-GVS.md' -DestinationPath '.build/N_m3u8DL-RE_${{ matrix.rid }}_gvs-iq.3.zip'
      - name: Upload RE package to draft release
        if: startsWith(github.ref, 'refs/tags/managed-re-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" .build/N_m3u8DL-RE_${{ matrix.rid }}_gvs-iq.3.zip --clobber
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/managed-re-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RE packages and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 6
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --notes-file docs/release-managed-re-v0.6.0-iq.3.md
