name: desktop

# main 提交自动构建 Windows / macOS 安装包；desktop-v* 标签另行发布 Release。
# 与 TUI 的 v* 标签互不干扰；Release 不标为 Latest，TUI 的发布页不受影响。
# 桌面端自动更新（app/src/main/updater.ts）按 desktop-v* 取最新发布里的 latest.yml。
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./app/package.json").version')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "desktop-v$version" ]]; then
            echo "::error::标签必须与 app/package.json 的版本一致：desktop-v$version"
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/iqcn-local/go.mod
      - name: Build local IQCN processor (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: node scripts/build-iqcn-local.mjs
      - name: Build local IQCN processor (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          node scripts/build-iqcn-local.mjs --platform=darwin --arch=arm64 --output=.build/iqcn-local/darwin-arm64/iqcn-local
          node scripts/build-iqcn-local.mjs --platform=darwin --arch=x64 --output=.build/iqcn-local/darwin-x64/iqcn-local
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build our maintained RE (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./scripts/build-managed-re.ps1 -Runtime win-x64 -Install
      - name: Build our maintained RE (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/build-managed-re.ps1 -Runtime osx-arm64
          ./scripts/build-managed-re.ps1 -Runtime osx-x64
      # app 复用 ../src/lib，类型检查需要仓库根的依赖
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run typecheck
      - name: Verify search source mapping
        run: bun test src/main/cards.test.ts src/main/search-sources.test.ts src/main/updater-release.test.ts src/shared
      - name: Verify bundled Windows media tools offline
        if: runner.os == 'Windows'
        working-directory: .
        run: bun run tools:check
      - name: Verify bounded download concurrency
        working-directory: .
        run: |
          bun test src/lib/ordered-download.test.ts
          bun test src/lib/iqcn-audio.test.ts
          bun test src/lib/iq-subtitles.test.ts src/lib/iqcn-subtitles.test.ts
          bun test src/lib/jobs-hub.test.ts --test-name-pattern "Douyin passes configured concurrency"
      - run: bun x electron-vite build
      - name: Verify Migu manifest transport in Electron (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun x vite build --config scripts/media-probe-smoke.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeEntry = (Resolve-Path '../.build/media-probe-smoke/smoke.cjs').Path
          $probe = Start-Process -FilePath 'node_modules/electron/dist/electron.exe' -ArgumentList $probeEntry -WorkingDirectory '..' -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath '../.build/media-probe-smoke/result.json'
          exit $probe.ExitCode
      - name: Verify separate Migu App and TV search filters (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath 'app/node_modules/electron/dist/electron.exe' -ArgumentList 'app/scripts/migu-search-smoke.cjs' -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath '.build/migu-search-smoke/result.json'
          exit $smoke.ExitCode
      - run: bun x electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            app/release/*.exe
            app/release/*.exe.blockmap
            app/release/*.dmg
            app/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify installers and publish desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          for file in "GVS-Setup-$version-x64.exe" "GVS-Setup-$version-x64.exe.blockmap" \
            "GVS-$version-arm64.dmg" "GVS-$version-x64.dmg" latest.yml latest-mac.yml; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          notes="docs/release-${GITHUB_REF_NAME}.md"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::已发布的版本不能覆盖；请递增版本并推送新标签"
              exit 1
            fi
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "GVS $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "GVS $version" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          if [ -f "$notes" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --notes-file "$notes"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          fi
