name: desktop

# 桌面端发布：推 desktop-v* 标签（如 desktop-v0.1.1）即构建 Windows / macOS 安装包并发 Release。
# 与 TUI 的 v* 标签互不干扰；Release 不标为 Latest，TUI 的发布页不受影响。
# 桌面端自动更新（app/src/main/updater.ts）按 desktop-v* 取最新发布里的 latest.yml。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "GVS 桌面端 $GITHUB_REF_NAME" --notes-file "docs/release-${GITHUB_REF_NAME}.md"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/iqcn-local/go.mod
      - name: Build local IQCN processor (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: node scripts/build-iqcn-local.mjs
      - name: Build local IQCN processor (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          node scripts/build-iqcn-local.mjs --platform=darwin --arch=arm64 --output=.build/iqcn-local/darwin-arm64/iqcn-local
          node scripts/build-iqcn-local.mjs --platform=darwin --arch=x64 --output=.build/iqcn-local/darwin-x64/iqcn-local
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build our maintained RE (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./scripts/build-managed-re.ps1 -Runtime win-x64 -Install
      - name: Build our maintained RE (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/build-managed-re.ps1 -Runtime osx-arm64
          ./scripts/build-managed-re.ps1 -Runtime osx-x64
      # app 复用 ../src/lib，类型检查需要仓库根的依赖
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - name: 版本号取自标签
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#desktop-v}"
      - run: node node_modules/electron/install.js
      - run: bun run typecheck
      - name: Verify search source mapping
        run: bun test src/main/cards.test.ts src/main/search-sources.test.ts src/shared
      - name: Verify bounded download concurrency
        working-directory: .
        run: |
          bun test src/lib/ordered-download.test.ts
          bun test src/lib/iqcn-audio.test.ts
          bun test src/lib/iq-subtitles.test.ts src/lib/iqcn-subtitles.test.ts
          bun test src/lib/jobs-hub.test.ts --test-name-pattern "Douyin passes configured concurrency"
      - run: bun x electron-vite build
      - name: Verify Migu manifest transport in Electron (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun x vite build --config scripts/media-probe-smoke.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeEntry = (Resolve-Path '../.build/media-probe-smoke/smoke.cjs').Path
          $probe = Start-Process -FilePath 'node_modules/electron/dist/electron.exe' -ArgumentList $probeEntry -WorkingDirectory '..' -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath '../.build/media-probe-smoke/result.json'
          exit $probe.ExitCode
      - name: Verify separate Migu App and TV search filters (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath 'app/node_modules/electron/dist/electron.exe' -ArgumentList 'app/scripts/migu-search-smoke.cjs' -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath '.build/migu-search-smoke/result.json'
          exit $smoke.ExitCode
      - run: bun x electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installers to draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.exe.blockmap release/*.dmg release/latest*.yml)
          test "${#files[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installers and publish desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          grep -Fq "GVS-Setup-${GITHUB_REF_NAME#desktop-v}-x64.exe" <<< "$assets"
          grep -Fq "GVS-${GITHUB_REF_NAME#desktop-v}-arm64.dmg" <<< "$assets"
          grep -Fq "GVS-${GITHUB_REF_NAME#desktop-v}-x64.dmg" <<< "$assets"
          grep -Fxq 'latest.yml' <<< "$assets"
          grep -Fxq 'latest-mac.yml' <<< "$assets"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --notes-file "docs/release-${GITHUB_REF_NAME}.md"
